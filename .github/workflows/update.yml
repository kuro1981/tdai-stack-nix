name: Check for TDAI image updates

on:
  schedule:
    - cron: '0 0 * * *'   # daily at midnight UTC
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to track (optional, e.g. 1.0.0-beta.2)
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  check-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check for new digests
        id: check
        run: |
          TAG="${{ github.event.inputs.tag }}"
          ARGS=(--check)
          [ -n "$TAG" ] && ARGS=(--check --tag "$TAG")

          if bash ./scripts/update.sh "${ARGS[@]}"; then
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "update_needed=true" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG:-$(jq -r '.version' images.json)}" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply update
        if: steps.check.outputs.update_needed == 'true'
        run: |
          TAG="${{ steps.check.outputs.tag }}"
          bash ./scripts/update.sh --tag "$TAG"

      - name: Create Pull Request
        if: steps.check.outputs.update_needed == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update TDAI image digests (${{ steps.check.outputs.tag }})"
          title: "chore: update TDAI image digests (${{ steps.check.outputs.tag }})"
          body: |
            ## Update TDAI stack image digests

            Docker Hub の `agentmemory/*` イメージに新しい digest が公開されたため追随します。

            タグではなく digest を正としているため、同じタグが差し替えられた場合も検知されます。

            ---
            *This PR was automatically generated by the update workflow.*
          branch: update-tdai-digests-${{ steps.check.outputs.tag }}
          delete-branch: true
          labels: |
            dependencies
            automated

      - name: Enable Auto-Merge
        if: steps.check.outputs.update_needed == 'true' && steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ steps.create-pr.outputs.pull-request-number }} --auto --squash --delete-branch
