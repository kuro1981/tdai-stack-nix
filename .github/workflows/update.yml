name: Check for TDAI upstream updates

on:
  schedule:
    - cron: '0 0 * * *'   # daily at midnight UTC
  workflow_dispatch:
    inputs:
      rev:
        description: Upstream revision to pin (optional)
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  check-update:
    runs-on: ubuntu-latest
    steps:
      # v4 / create-pull-request v6・v7 は Node 20。runner 側で強制的に
      # Node 24 で動かされており、いずれ動かなくなる。Node 24 対応の
      # major（checkout v5 / create-pull-request v8）に上げてある。
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check for upstream updates
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REV="${{ github.event.inputs.rev }}"
          ARGS=(--check)
          [ -n "$REV" ] && ARGS=(--check --rev "$REV")

          if bash ./scripts/update.sh "${ARGS[@]}"; then
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "update_needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply update
        if: steps.check.outputs.update_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REV="${{ github.event.inputs.rev }}"
          if [ -n "$REV" ]; then bash ./scripts/update.sh --rev "$REV"; else bash ./scripts/update.sh; fi

      - name: Create Pull Request
        if: steps.check.outputs.update_needed == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update TDAI upstream pin"
          title: "chore: update TDAI upstream pin"
          body: |
            ## Update TDAI upstream pin

            上流 TencentDB-Agent-Memory の追跡ブランチに新しいコミットがあったため追随します。

            upstreamRev / upstreamHash / locks/ / npmDepsHash の 4 つを更新しています。
            ロックを再生成しないと npmDepsHash が古い依存のままになるため、順序に依存関係があります。

            ---
            *This PR was automatically generated by the update workflow.*

          branch: update-tdai-upstream
          delete-branch: true
          labels: |
            dependencies
            automated

      # リポジトリ設定で auto-merge が無効だと `--auto` は
      # "Auto-merge is not enabled for this repository" で落ちる。
      # 必須チェックも設定していないため --auto に待つ相手はおらず、
      # その場での squash と等価。設定が無い場合はそちらへ落とし、
      # どちらも駄目なら PR は開いたまま残して手動マージに委ねる。
      - name: Merge the update PR
        if: steps.check.outputs.update_needed == 'true' && steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          gh pr merge "$PR" --auto --squash --delete-branch \
            || gh pr merge "$PR" --squash --delete-branch \
            || echo "::warning::PR #$PR を自動マージできませんでした。手動でマージしてください。"
