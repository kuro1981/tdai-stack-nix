name: Check for TDAI upstream updates

on:
  schedule:
    - cron: '0 0 * * *'   # daily at midnight UTC
  workflow_dispatch:
    inputs:
      rev:
        description: Upstream revision to pin (optional)
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  check-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check for upstream updates
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REV="${{ github.event.inputs.rev }}"
          ARGS=(--check)
          [ -n "$REV" ] && ARGS=(--check --rev "$REV")

          if bash ./scripts/update.sh "${ARGS[@]}"; then
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "update_needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply update
        if: steps.check.outputs.update_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REV="${{ github.event.inputs.rev }}"
          if [ -n "$REV" ]; then bash ./scripts/update.sh --rev "$REV"; else bash ./scripts/update.sh; fi

      - name: Create Pull Request
        if: steps.check.outputs.update_needed == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update TDAI upstream pin"
          title: "chore: update TDAI upstream pin"
          body: |
            ## Update TDAI upstream pin

            上流 TencentDB-Agent-Memory の追跡ブランチに新しいコミットがあったため追随します。

            upstreamRev / upstreamHash / locks/ / npmDepsHash の 4 つを更新しています。
            ロックを再生成しないと npmDepsHash が古い依存のままになるため、順序に依存関係があります。

            ---
            *This PR was automatically generated by the update workflow.*

          branch: update-tdai-upstream
          delete-branch: true
          labels: |
            dependencies
            automated

      - name: Enable Auto-Merge
        if: steps.check.outputs.update_needed == 'true' && steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ steps.create-pr.outputs.pull-request-number }} --auto --squash --delete-branch
